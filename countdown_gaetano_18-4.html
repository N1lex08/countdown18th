<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Countdown 18° di Gaetano</title>
<style>
    body{
        margin:0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #111827, #4f46e5);
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        text-align:center;
        padding:20px;
    }
    .card{
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        padding: 40px;
        max-width: 800px;
        width:100%;
        box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    h1{
        font-size: clamp(2rem, 5vw, 4rem);
        margin-bottom:10px;
    }
    p{
        opacity:.9;
    }
    .countdown{
        display:grid;
        grid-template-columns: repeat(4, 1fr);
        gap:16px;
        margin-top:30px;
    }
    .box{
        background: rgba(255,255,255,0.15);
        border-radius: 20px;
        padding: 24px 12px;
    }
    .number{
        font-size: clamp(2rem, 5vw, 4rem);
        font-weight:bold;
    }
    .label{
        font-size: .9rem;
        text-transform: uppercase;
        opacity: .8;
    }
    #message{
        margin-top:30px;
        font-size:1.5rem;
        font-weight:bold;
    }
    @media(max-width:700px){
        .countdown{
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
</head>
<body>
    <div class="card">
        <h1>🎉 Countdown al 18° di Gaetano 🎉</h1>
        <p>Modifica la data nel codice JavaScript per impostare il compleanno.</p>

        <div class="countdown">
            <div class="box">
                <div class="number" id="days">0</div>
                <div class="label">Giorni</div>
            </div>
            <div class="box">
                <div class="number" id="hours">0</div>
                <div class="label">Ore</div>
            </div>
            <div class="box">
                <div class="number" id="minutes">0</div>
                <div class="label">Minuti</div>
            </div>
            <div class="box">
                <div class="number" id="seconds">0</div>
                <div class="label">Secondi</div>
            </div>
        </div>

        <div id="message"></div>
    </div>

<script>
    // CAMBIA QUESTA DATA con quella del 18° compleanno di Gaetano
    const targetDate = new Date(); targetDate.setHours(24,0,0,0);

    function updateCountdown(){
        const now = new Date().getTime();
        const distance = targetDate - now;

        if(distance <= 0){
            document.getElementById("message").innerHTML =
                "🥳 È arrivato il 18° compleanno di Gaetano!";
            document.querySelector(".countdown").style.display = "none";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = days;
        document.getElementById("hours").textContent = hours;
        document.getElementById("minutes").textContent = minutes;
        document.getElementById("seconds").textContent = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
</body>
</html>
